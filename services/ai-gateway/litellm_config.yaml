        thinking_config:
          thinking_level: "high"

  gemini36-flash-low-base: &gemini36-flash-low-base
    model: gemini/gemini-3.6-flash
    rpm: 5
    tpm: 250000
    timeout: 120
    extra_body:
      generationConfig:
        thinking_config:
          thinking_level: "low"

  gemini36-flash-medium-base: &gemini36-flash-medium-base
