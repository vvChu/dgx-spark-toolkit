x-templates:
  ocr-tier4-base: &ocr-tier4-base
    model: gemini/gemini-2.5-flash
    rpm: 5
    tpm: 250000
    timeout: 120

  ocr-fallback-base: &ocr-fallback-base
    model: gemini/gemini-3.5-flash-lite
    rpm: 10
    tpm: 250000
    timeout: 120

  ocr-primary-base: &ocr-primary-base
    model: gemini/gemini-3.1-flash-lite
    rpm: 15
    tpm: 250000
    timeout: 120
    safety_settings:
      - category: HARM_CATEGORY_HARASSMENT
        threshold: BLOCK_NONE
      - category: HARM_CATEGORY_HATE_SPEECH
        threshold: BLOCK_NONE
      - category: HARM_CATEGORY_SEXUALLY_EXPLICIT
        threshold: BLOCK_NONE
      - category: HARM_CATEGORY_DANGEROUS_CONTENT
        threshold: BLOCK_NONE

  text-gemma-base: &text-gemma-base
    model: openai/gemma-4-31b-it
    api_base: https://generativelanguage.googleapis.com/v1beta/openai/
    rpm: 30
    tpm: 15000

  text-gemma-12b-base: &text-gemma-12b-base
    model: openai/gemma-4-26b-a4b-it
    api_base: https://generativelanguage.googleapis.com/v1beta/openai/
    rpm: 30
    tpm: 15000

  reasoning-gemma-base: &reasoning-gemma-base
    model: openai/gemma-4-31b-it
    api_base: https://generativelanguage.googleapis.com/v1beta/openai/
    rpm: 15
    tpm: 250000

  reasoning-fallback-base: &reasoning-fallback-base
    model: openai/gemma-4-26b-a4b-it
    api_base: https://generativelanguage.googleapis.com/v1beta/openai/
    rpm: 15
    tpm: 250000

  gemini-embed-base: &gemini-embed-base
    model: gemini/gemini-embedding-2
    rpm: 100
    tpm: 30000
    timeout: 60

  gemini25-flash-lite-base: &gemini25-flash-lite-base
    model: gemini/gemini-2.5-flash-lite
    rpm: 10
    tpm: 250000
    timeout: 120
    drop_params: true

  gemini-embedding-2-base: &gemini-embedding-2-base
    model: gemini/gemini-embedding-2
    rpm: 100
    tpm: 30000
    timeout: 60

  gemini35-flash-low-base: &gemini35-flash-low-base
    model: gemini/gemini-3.5-flash
    rpm: 5
    tpm: 250000
    timeout: 120
    extra_body:
      generationConfig:
        thinking_config:
          thinking_level: "low"

  gemini35-flash-medium-base: &gemini35-flash-medium-base
    model: gemini/gemini-3.5-flash
    rpm: 5
    tpm: 250000
    timeout: 120
    extra_body:
      generationConfig:
        thinking_config:
          thinking_level: "medium"

  gemini35-flash-high-base: &gemini35-flash-high-base
