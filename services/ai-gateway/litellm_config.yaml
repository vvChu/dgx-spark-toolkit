router_settings:
  routing_strategy: usage-based-routing
  allowed_fails: 2
  cooldown_time: 60
  num_retries: 3
  backoff_strategy: exponential
  retry_after: 5
  timeout: 900

  # ── RPD Budget Enforcement (replaces the invalid `rpd` in litellm_params) ──
  # These caps protect free-tier quotas. When a group hits its daily budget,
  # LiteLLM will route to the next fallback automatically.
  # Formula: budget = num_keys × rpd_per_key (from FREE_TIER_LIMITS.md)
  model_budget_config:
    ocr-primary:        # gemini-3.1-flash-lite, 10 keys (KEY_2..KEY_11)
      max_budget: 5000  # 10 keys × 500 RPD
      budget_duration: 1d
    ocr-fallback:       # gemini-3.5-flash-lite, 10 keys
      max_budget: 2000  # 10 keys × 200 RPD
      budget_duration: 1d
    gemini-embed:       # gemini-embedding-2, 10 keys x 1000 RPD = 10,000
      max_budget: 10000
      budget_duration: 1d

    gemini-2.5-flash-lite:
      max_budget: 200   # 10 keys x 20 RPD = 200
      budget_duration: 1d
    gemini-embedding-2:
      max_budget: 10000  # 10 keys x 1000 RPD = 10,000
      budget_duration: 1d

    gemini-3.5-flash-low:
      max_budget: 200   # 10 keys x 20 RPD = 200
      budget_duration: 1d
    gemini-3.5-flash-medium:
      max_budget: 200   # 10 keys x 20 RPD = 200
      budget_duration: 1d
    gemini-3.5-flash-high:
      max_budget: 200   # 10 keys x 20 RPD = 200
      budget_duration: 1d
    gemini-3.6-flash-low:
      max_budget: 1000  # 10 keys x 100 RPD = 1000
      budget_duration: 1d
    gemini-3.6-flash-medium:
      max_budget: 1000  # 10 keys x 100 RPD = 1000
      budget_duration: 1d
    gemini-3.6-flash-high:
      max_budget: 1000  # 10 keys x 100 RPD = 1000
      budget_duration: 1d

    text-gemma:         # gemma-3-27b-it, 10 keys × 14,400 RPD = 144,000
      max_budget: 144000
      budget_duration: 1d
    text-gemma-12b:     # gemma-3-12b-it, 10 keys × 14,400 RPD = 144,000
      max_budget: 144000
      budget_duration: 1d
    text-gemma-4b:      # gemma-3-4b-it, 10 keys × 14,400 RPD = 144,000
      max_budget: 144000
      budget_duration: 1d
    reasoning-gemma:    # gemma-4-31b-it, 10 keys x 1,500 RPD = 15,000
      max_budget: 15000
      budget_duration: 1d
    reasoning-fallback:    # gemma-4-26b-it, 10 keys x 1,500 RPD = 15,000
      max_budget: 15000
      budget_duration: 1d

  fallbacks:
    - {"claude-opus-4-6-thinking": ["claude-opus-4-5-thinking", "claude-sonnet-4-6-thinking",
        "gemini-3.1-pro-high", "rag-core"]}
    - {"claude-opus-4-5-thinking": ["claude-sonnet-4-6-thinking", "claude-sonnet-4-5-thinking",
        "gemini-3.1-pro-high", "rag-core"]}
    - {"claude-sonnet-4-6-thinking": ["claude-sonnet-4-5-thinking", "ocr-tier4",
        "rag-core"]}
    - {"claude-sonnet-4-5-thinking": ["claude-sonnet-4-6", "ocr-tier4", "rag-core"]}
    - {"claude-opus-4-6": ["claude-opus-4-5", "gemini-3.1-pro-high", "rag-core"]}
    - {"claude-sonnet-4-6": ["claude-sonnet-4-5", "ocr-tier4", "rag-core"]}
    - {"claude-sonnet-4-5": ["claude-haiku-4-5", "ocr-tier4", "rag-core"]}
    - {"claude-haiku-4-5": ["claude-haiku-4", "ocr-tier4", "rag-core"]}
    - {"gemini-3.6-flash-high": ["gemini-3.6-flash-medium", "gemini-3.5-flash-high", "gemini-3.1-pro-high", "ocr-tier4", "rag-core"]}
    - {"gemini-3.6-flash-medium": ["gemini-3.6-flash-low", "gemini-3.5-flash-medium", "gemini-3.1-pro-high", "ocr-tier4", "rag-core"]}
    - {"gemini-3.6-flash-low": ["gemini-3.5-flash-low", "gemini-3.1-pro-high", "ocr-tier4", "rag-core"]}
    - {"gemini-3.1-pro-high": ["gemini-pro-agent", "gemini-3.1-pro-low", "rag-core"]}
    - {"gemini-pro-agent": ["gemini-3.1-pro-low", "rag-core"]}
    - {"gemini-3.1-pro-low": ["ocr-tier4", "rag-core"]}
    - {"gemini-3.1-flash-lite": ["ocr-tier4", "rag-core"]}
    - {"gemini-3.5-flash-low": ["gemini-3.1-pro-high", "ocr-tier4", "rag-core"]}
    - {"gemini-3-flash-agent": ["gemini-3.5-flash-low", "gemini-3.1-pro-high", "ocr-tier4", "rag-core"]}
    # NEW OCR FALLBACK CHAIN (rag-core restored as ultimate safety net)
    - {"ocr-primary": ["ocr-fallback", "ocr-tier4", "rag-core"]}
    - {"ocr-fallback": ["ocr-tier4", "rag-core"]}
    - {"ocr-tier4": ["rag-core"]}

    - {"audio-primary": ["whisper-primary", "whisper-local"]}

    - {"gpt-oss-120b-medium": ["gemini-3.1-pro-high"]}
    - {"text-gemma": ["text-gemma-12b", "text-gemma-4b", "rag-core"]}
    - {"text-gemma-12b": ["text-gemma-4b", "rag-core"]}
    - {"text-gemma-4b": ["rag-core"]}
    - {"rag-core": []}  # No fallback — rag-light requires vllm-light profile (not always running)
    - {"rag-light": ["rag-core"]}
    - reasoning-gemma:
        - reasoning-fallback
        - rag-core
    - reasoning-fallback:
        - rag-core

  default_fallbacks: ["ocr-fallback"]

litellm_settings:
  success_callback: ["prometheus", "postgresql"]
  failure_callback: ["prometheus", "postgresql"]
  callbacks: ["custom_callbacks.gemini_corrector_instance"]
  cache: true
  cache_params:
    type: redis
    host: litellm-redis
    port: 6379
    ttl: 3600
    caching_groups:
      - ["ocr-primary", "ocr-fallback", reasoning-gemma, reasoning-fallback]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  background_health_checks: false
  health_check_interval: 120
  health_check_details: false
