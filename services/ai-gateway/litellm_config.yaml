  - model_name: bge-m3
    litellm_params:
      model: openai/bge-m3
      api_base: http://qwen35b:8000/v1
      api_key: "unused"

router_settings:
  routing_strategy: latency-based-routing
  allowed_fails: 1
  cooldown_time: 60
  num_retries: 3
  fallbacks_retry_after: 120

  fallbacks:
    - {"claude-opus-4-6-thinking": ["gemini-3.1-pro-high", "gpt-oss-120b-medium", "rag-core"]}
    - {"claude-opus-4-6": ["claude-opus-4-5", "gemini-3.1-pro-high", "rag-core"]}
    - {"claude-sonnet-4-6": ["claude-sonnet-4-5", "gemini-3-flash", "rag-core"]}
    - {"claude-haiku-4-5": ["claude-haiku-4", "gemini-3-flash", "rag-core"]}
    - {"gemini-3.1-pro-high": ["gemini-3.1-pro-low", "gemini-3-pro-high", "rag-core"]}
    - {"gemini-3.1-pro-low": ["gemini-3-pro-low", "gemini-2.5-flash", "rag-core"]}
    - {"gemini-3-flash": ["gemini-2.5-flash", "rag-core"]}
    - {"gemini-2.5-flash": ["gemini-2.5-flash-lite", "rag-core"]}
    - {"rag-core": ["gemini-3-flash", "gemini-2.5-flash"]}

litellm_settings:
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  cache: true
  cache_params:
    type: redis
    host: litellm-redis
    port: 6379
    semantic_similarity_threshold: 0.85

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
