router_settings:
  routing_strategy: latency-based-routing
  allowed_fails: 3              # 3 fails trước khi cooldown (tránh false positive)
  cooldown_time: 600            # cooldown 10 phút — phù hợp quota reset hourly
  num_retries: 2                # 2 retries (giảm lãng phí khi model chắc chắn 503)
  retry_after: 15               # chờ 15s giữa các retry
  timeout: 30                   # request timeout 30s

  fallbacks:
    # Claude tiers — cascade xuống model rẻ hơn → Gemini → Local
    - {"claude-opus-4-6-thinking": ["claude-opus-4-5-thinking", "claude-sonnet-4-6-thinking", "gemini-3.1-pro-high", "rag-core"]}
    - {"claude-opus-4-5-thinking": ["claude-sonnet-4-6-thinking", "claude-sonnet-4-5-thinking", "gemini-3.1-pro-high", "rag-core"]}
    - {"claude-sonnet-4-6-thinking": ["claude-sonnet-4-5-thinking", "gemini-3-flash", "rag-core"]}
    - {"claude-sonnet-4-5-thinking": ["claude-sonnet-4-6", "gemini-3-flash", "rag-core"]}
    - {"claude-opus-4-6": ["claude-opus-4-5", "gemini-3.1-pro-high", "rag-core"]}
    - {"claude-sonnet-4-6": ["claude-sonnet-4-5", "gemini-3-flash", "rag-core"]}
    - {"claude-sonnet-4-5": ["claude-haiku-4-5", "gemini-3-flash", "rag-core"]}
    - {"claude-haiku-4-5": ["claude-haiku-4", "gemini-3-flash", "rag-core"]}

    # Gemini tiers — cascade qua các biến thể (bao gồm 3.1 Flash Lite + Gemma fallback)
    - {"gemini-3.1-pro-high": ["gemini-3.1-pro", "gemini-3.1-pro-low", "rag-core"]}
    - {"gemini-3.1-pro": ["gemini-3.1-pro-low", "gemini-3-pro-high", "rag-core"]}
    - {"gemini-3.1-pro-low": ["gemini-3-pro-low", "gemini-3-flash", "rag-core"]}
    - {"gemini-3-flash": ["gemini-3.1-flash-lite", "gemma-3-27b", "rag-core"]}
    - {"gemini-3.1-flash-lite": ["gemma-3-27b", "gemini-3-flash", "rag-core"]}
    - {"gemma-3-27b": ["gemini-3.1-flash-lite", "rag-core"]}

    # GPT-OSS → Gemini → Local
    - {"gpt-oss-120b-medium": ["gemini-3.1-pro-high", "rag-core"]}

    # Local fallback → best available remote
    - {"rag-core": ["gemini-3-flash", "gemini-3.1-flash-lite"]}
    - {"rag-light": ["rag-core"]}

  # Catch-all: bất kỳ model nào fail mà không có fallback cụ thể → rag-core
  default_fallbacks: ["rag-core"]

litellm_settings:
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  cache: true
  cache_params:
    type: redis
    host: litellm-redis
    port: 6379
    semantic_similarity_threshold: 0.85

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  background_health_checks: true
  health_check_interval: 120    # 2 phút — phát hiện model recover nhanh hơn
  health_check_details: false
