services:
  rag-service:
    build:
      context: ./services/rag-service
    container_name: rag-service
    environment:
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - VLLM_API_BASE=${VLLM_API_BASE:-http://ai-gateway:4000/v1}
      - VLLM_MODEL=${VLLM_MODEL_CORE:-rag-core}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - NEO4J_URI=bolt://neo4j-graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - GPU_ENABLED=1
      - CUDA_VISIBLE_DEVICES=0
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - DEFAULT_RAG_MODEL=${DEFAULT_RAG_MODEL:-rag-light}
      - MAX_OCR_CONCURRENCY=${MAX_OCR_CONCURRENCY:-1}
      - MAX_WORKERS=${MAX_WORKERS:-2}
      - MAX_DIGITAL_WORKERS=${MAX_DIGITAL_WORKERS:-2}
      - DATABASE_URL=${DATABASE_URL}
      - FORCE_CPU_RERANKER=1
      - FORCE_CPU_EMBEDDING=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - REDIS_URL=redis://litellm-redis:6379/1
      - PRIMARY_VISION_MODEL=${PRIMARY_VISION_MODEL:-gemini-3-flash}
      - FALLBACK_VISION_MODEL=${FALLBACK_VISION_MODEL:-gemini-3.1-flash-lite}
      - IMAGE_PREPROCESS=${IMAGE_PREPROCESS:-1}
      - OCR_RENDER_DPI=${OCR_RENDER_DPI:-300}
      - SURYA_DEVICE=${SURYA_DEVICE:-auto}
      - CHUNK_MAX_CHARS=${CHUNK_MAX_CHARS:-14500}
      - CROSS_VALIDATE_OCR=${CROSS_VALIDATE_OCR:-1}
      - REMOVE_WATERMARKS=${REMOVE_WATERMARKS:-0}
    working_dir: /app
    command: ["python3", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8005:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      milvus-standalone:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./services/rag-service:/app
      - ${LEGAL_DOCS_DIR}:/app/data/legal_docs_source
      - ${EXPORT_DIR}:/app/exports
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/home/appuser/.cache/huggingface
      - model_cache:/app/model_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12G
        reservations:
          cpus: '2'
          memory: 4G
    networks:
      - rag-network

  rag-watcher:
    profiles: ["ingest"]
    build:
      context: ./services/rag-service
    environment:
      - SOURCE_DIR=${SOURCE_DIR:-/app/data/legal_test}
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - EMBEDDING_MODEL=BAAI/bge-m3
      - VLLM_API_BASE=http://ai-gateway:4000/v1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - MAX_WORKERS=${MAX_WORKERS:-1}
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - VLLM_MODEL=${VLLM_MODEL_CORE:-rag-core}
      - VISION_MODEL=${VLLM_MODEL_CORE:-rag-core}
      - JSON_MODEL=${VLLM_MODEL_CORE:-rag-core}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - NEO4J_URI=bolt://neo4j-graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - CUDA_VISIBLE_DEVICES=0
      - MAX_OCR_CONCURRENCY=${MAX_OCR_CONCURRENCY:-1}
      - MAX_DIGITAL_WORKERS=${MAX_DIGITAL_WORKERS:-4}
      - DATABASE_URL=${DATABASE_URL}
      - FORCE_CPU_EMBEDDING=1
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - REDIS_URL=redis://litellm-redis:6379/1
      - PRIMARY_VISION_MODEL=${PRIMARY_VISION_MODEL:-gemini-3-flash}
      - FALLBACK_VISION_MODEL=${FALLBACK_VISION_MODEL:-gemini-3.1-flash-lite}
      - IMAGE_PREPROCESS=${IMAGE_PREPROCESS:-1}
      - OCR_RENDER_DPI=${OCR_RENDER_DPI:-300}
      - SURYA_DEVICE=${SURYA_DEVICE:-auto}
      - CHUNK_MAX_CHARS=${CHUNK_MAX_CHARS:-14500}
      - CROSS_VALIDATE_OCR=${CROSS_VALIDATE_OCR:-1}
      - REMOVE_WATERMARKS=${REMOVE_WATERMARKS:-0}
      - HF_HOME=/home/appuser/.cache/huggingface
      - HF_HUB_DOWNLOAD_TIMEOUT=5
      - EMBEDDING_MODEL=/home/appuser/.cache/huggingface/hub/models--BAAI--bge-m3/snapshots/5617a9f61b028005a4858fdac845db406aefb181

    volumes:
      - ./services/rag-service:/app
      - ${LEGAL_DOCS_DIR}:/app/data/legal_docs_source
      - ${EXPORT_DIR}:/app/exports
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/home/appuser/.cache/huggingface
      - model_cache:/app/model_cache
    command: [ "python3", "-m", "ingestion.pipeline" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      milvus-standalone:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ai-gateway:
        condition: service_started
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '6'
          memory: 14G
        reservations:
          cpus: '2'
          memory: 8G
    healthcheck:
      disable: true
    networks:
      - rag-network

    # LiteLLM AI Gateway Proxy
  ai-gateway:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai-gateway
    ports:
      - "8090:4000"
      - "4001:4001" # Admin UI
    environment:
      - GATEWAY_PROXY_URL=${GATEWAY_PROXY_URL}
      - GATEWAY_PROXY_KEY=${GATEWAY_PROXY_KEY}
      - VIBER_PROXY_URL=${VIBER_PROXY_URL:-https://viber.claudegateway.site/v1}
      - VIBER_PROXY_KEY=${VIBER_PROXY_KEY}
      - GATEWAY_LOCAL_URL=${GATEWAY_LOCAL_URL:-http://${HOST_IP:-localhost}:8004/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3}
      - GEMINI_API_KEY_4=${GEMINI_API_KEY_4}
      - GEMINI_API_KEY_5=${GEMINI_API_KEY_5}
      - GEMINI_API_KEY_6=${GEMINI_API_KEY_6}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_LOG=INFO
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      - REDIS_URL=redis://litellm-redis:6379/0
      - STORE_MODEL_IN_DB=True
    volumes:
      - ./services/ai-gateway/litellm_config.yaml:/app/litellm_config.yaml
    command: [ "--config", "/app/litellm_config.yaml", "--port", "4000" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
      litellm-redis:
        condition: service_healthy
    networks:
      - rag-network

  litellm-db:
    image: postgres:15-alpine
    container_name: litellm-postgres
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
      - POSTGRES_DB=litellm
    ports:
      - "15432:5432"
    volumes:
      - litellm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  litellm-redis:
    image: redis:7-alpine
    container_name: litellm-redis
    ports:
      - "16379:6379"
    volumes:
      - litellm_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  # Milvus Components (Etcd, MinIO, Milvus Standalone)
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.23
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  milvus-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: milvus-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:-minioadmin}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY:-minioadmin}}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  milvus-standalone:
    image: milvusdb/milvus:v2.5.27

    container_name: milvus-standalone
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:-minioadmin}}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY:-minioadmin}}
    volumes:
      - milvus_data:/var/lib/milvus
    command: [ "milvus", "run", "standalone" ]
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  # Knowledge Graph
  neo4j:
    image: neo4j:5.23.0
    container_name: neo4j-graph
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - rag-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./monitoring/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./monitoring/provisioning/alerting/rag_alerts.yaml:/etc/grafana/provisioning/alerting/rag_alerts.yaml
      - ./monitoring/grafana-vllm-dashboard.json:/var/lib/grafana/dashboards/vllm.json
      - ./monitoring/grafana-rag-dashboard.json:/var/lib/grafana/dashboards/rag.json
      - ./monitoring/grafana-ingestion-dashboard.json:/var/lib/grafana/dashboards/ingestion.json
    restart: unless-stopped
    networks:
      - rag-network

  rag-frontend:
    build:
      context: ./services/frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://${HOST_IP:-localhost}:8005}
    container_name: rag-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://${HOST_IP:-localhost}:8005}
    depends_on:
      rag-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network
  vllm-4b:
    profiles: ["vllm-light"]  # On-demand only — avoid OOM conflict with 35B
    image: hellohal2064/vllm-qwen3.5-gb10:blackwell-sm121
    container_name: qwen3-9b
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m
    restart: unless-stopped
    ports:
      - "8003:8000"
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      - PORT=8000
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
    entrypoint: [ "python3", "-m", "vllm.entrypoints.openai.api_server" ]
    command: >
      --model cyankiwi/Qwen3.5-9B-AWQ-4bit
      --served-model-name qwen3.5-9b
      --port 8000
      --gpu-memory-utilization 0.12
      --max-model-len 8192
      --dtype half
      --quantization awq
      --trust-remote-code
    networks:
      - rag-network

  vllm-35b:
    image: hellohal2064/vllm-qwen3.5-gb10:blackwell-sm121
    container_name: qwen35b
    ports:
      - "8004:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
    deploy:
      resources:
        limits:
          memory: 96G
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      - PORT=8000
      - ATTENTION_BACKEND=flashinfer
      - GPU_MEMORY_UTIL=0.85
      - MAX_MODEL_LEN=32768
    volumes:
      - ${QWEN35B_MODEL_DIR}:/models/model
      - ./scripts:/app/scripts
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
    entrypoint: [ "python3", "-m", "vllm.entrypoints.openai.api_server" ]
    command: >
      --model /models/model/snapshots/${QWEN35B_SNAPSHOT:-0b2752837483aa34b3db6e83e151b150c0e00e49}
      --served-model-name qwen3.5-35b
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.85
      --max-model-len 32768
      --kv-cache-dtype fp8
      --max-num-batched-tokens 8192
      --max-num-seqs 16
      --enable-prefix-caching
      --enable-chunked-prefill
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --trust-remote-code
    networks:
      - rag-network
    restart: unless-stopped

  locust:
    image: locustio/locust:latest
    container_name: locust-loadtest
    profiles: ["loadtest"]
    volumes:
      - ./services/rag-service/benchmarks:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host http://rag-service:8000
    ports:
      - "8089:8089"
    networks:
      - rag-network
    restart: "no"

networks:
  rag-network:
    external: true

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
  litellm_data:
  litellm_redis_data:
  model_cache:  # Persistent model cache — survives container rebuilds
