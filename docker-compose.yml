services:
  rag-service:
    build:
      context: ./services/rag-service
    container_name: rag-service
    environment:
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - VLLM_API_BASE=${VLLM_API_BASE:-http://host.docker.internal:8004/v1}
      - VLLM_MODEL=${VLLM_MODEL_35B:-qwen3.5-35b}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    ports:
      - "8005:8000"
    depends_on:
      - milvus-standalone
    volumes:
      - ./services/rag-service:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - rag-network

  # LiteLLM AI Gateway Proxy
  ai-gateway:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai-gateway
    ports:
      - "8090:4000"
    environment:
      - GATEWAY_PROXY_URL=${GATEWAY_PROXY_URL}
      - GATEWAY_PROXY_KEY=${GATEWAY_PROXY_KEY}
      - GATEWAY_LOCAL_URL=${GATEWAY_LOCAL_URL:-http://host.docker.internal:8001/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - ./services/ai-gateway/litellm_config.yaml:/app/litellm_config.yaml
    command: [ "--config", "/app/litellm_config.yaml", "--port", "4000" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - rag-network

  # Milvus Components (Etcd, MinIO, Milvus Standalone)
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  milvus-standalone:
    image: milvusdb/milvus:v2.3.3
    container_name: milvus-standalone
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    command: [ "milvus", "run", "standalone" ]
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana-vllm-dashboard.json:/var/lib/grafana/dashboards/vllm.json
    networks:
      - rag-network

networks:
  rag-network:
    name: rag-network

volumes:
  etcd_data:
  minio_data:
  milvus_data:
