global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  # RAG Service (FastAPI + Prometheus Instrumentator)
  - job_name: 'rag-service'
    scrape_interval: 5s
    static_configs:
      - targets: ['rag-service:8000']

  # RAG Watcher / Ingestion (on port 8001)
  - job_name: 'rag-watcher'
    scrape_interval: 10s
    metrics_path: '/'
    static_configs:
      - targets: ['rag-watcher:8001']

  # vLLM Qwen 3.5 35B
  - job_name: 'vllm-35b'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['${VLLM_35B_HOST:-host.docker.internal}:${VLLM_35B_METRICS_PORT:-8004}']
        labels:
          model: 'qwen3.5-35b'
          quantization: 'nvfp4'

  # vLLM Qwen 3.5 4B
  - job_name: 'vllm-4b'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['${VLLM_4B_HOST:-host.docker.internal}:${VLLM_4B_METRICS_PORT:-8003}']
        labels:
          model: 'qwen3.5-4b'
          quantization: 'nvfp4'

  # AI Gateway (LiteLLM)
  - job_name: 'ai-gateway'
    scrape_interval: 15s
    static_configs:
      - targets: ['ai-gateway:4000']
