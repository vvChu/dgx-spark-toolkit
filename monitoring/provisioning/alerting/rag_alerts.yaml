apiVersion: 1

groups:
  - orgId: 1
    name: 'RAG Quality Alerts'
    folder: 'RAG Monitoring'
    interval: 1m
    rules:
      - uid: 'rag_low_faithfulness'
        title: 'RAG Low Faithfulness'
        condition: 'A'
        data:
          - refId: 'A'
            datasourceUid: 'prometheus'
            relativeTimeRange:
              from: 300
              to: 0
            model:
              disableTextWrap: false
              editorMode: code
              expr: 'rag_eval_faithfulness < 0.6'
              fullMetaSearch: false
              hide: false
              includeNullMetadata: true
              instant: true
              legendFormat: 'Faithfulness'
              range: false
              refId: 'A'
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: 'RAG response faithfulness is low ({{ $values.A.Value }})'
          description: 'The Judge-LLM has detected that legal answers are not well-grounded in the retrieved context.'
        labels:
          severity: critical

      - uid: 'rag_low_relevancy'
        title: 'RAG Low Relevancy'
        condition: 'A'
        data:
          - refId: 'A'
            datasourceUid: 'prometheus'
            relativeTimeRange:
              from: 300
              to: 0
            model:
              disableTextWrap: false
              editorMode: code
              expr: 'rag_eval_relevancy < 0.6'
              fullMetaSearch: false
              hide: false
              includeNullMetadata: true
              instant: true
              legendFormat: 'Relevancy'
              range: false
              refId: 'A'
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: 'RAG response relevancy is low ({{ $values.A.Value }})'
          description: 'The Judge-LLM has detected that the answers are not directly addressing the user queries.'
        labels:
          severity: warning

      - uid: 'rag_service_down'
        title: 'RAG Service Down'
        condition: 'A'
        data:
          - refId: 'A'
            datasourceUid: 'prometheus'
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: 'up{job="rag-service"} == 0'
              refId: 'A'
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: 'RAG Backend API is DOWN'
          description: 'The rag-service container is unreachable by Prometheus.'
        labels:
          severity: critical
      - uid: 'vllm_high_vram'
        title: 'vLLM High KV Cache Usage'
        condition: 'A'
        data:
          - refId: 'A'
            datasourceUid: 'prometheus'
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: 'vllm:kv_cache_usage_perc > 0.85'
              refId: 'A'
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: 'vLLM KV Cache Usage is HIGH ({{ $values.A.Value }})'
          description: 'GPU KV Cache usage has exceeded 85% for more than 5 minutes on Blackwell GPU.'
        labels:
          severity: warning

      - uid: 'vllm_low_throughput'
        title: 'vLLM Low Generation Throughput'
        condition: 'A'
        data:
          - refId: 'A'
            datasourceUid: 'prometheus'
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: 'rate(vllm:generation_tokens_total[5m]) < 5 and vllm:num_requests_running > 0'
              refId: 'A'
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          summary: 'vLLM Throughput is LOW under load ({{ $values.A.Value }} tok/s)'
          description: 'The average generation speed has dropped below 5 tokens/sec while requests are active.'
        labels:
          severity: warning
