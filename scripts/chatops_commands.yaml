version: "1.0"

commands:
  - id: "system.status"
    slash: "/status"
    description: "Kiểm tra tình trạng CPU, RAM, NVMe và 8 containers cốt lõi"
    risk_tier: "READ_ONLY"
    service_lock: null
    runner: "internal"

  - id: "system.memory"
    slash: "/memory"
    description: "Chi tiết RAM, Swap và Top 5 tiến trình ngốn bộ nhớ"
    risk_tier: "READ_ONLY"
    service_lock: null
    runner: "internal"

  - id: "system.stats"
    slash: "/stats"
    description: "Thống kê sản lượng Tokens, Requests và Top Models trong ngày"
    risk_tier: "READ_ONLY"
    service_lock: null
    runner: "internal"

  - id: "host.gpu"
    slash: "/gpu"
    description: "Truy vấn nhiệt độ, xung nhịp và bộ nhớ GPU Blackwell GB10"
    risk_tier: "READ_ONLY"
    service_lock: null
    runner: "internal"

  - id: "system.openwebui.upgrade"
    slash: "/upgrade_owu"
    description: "Nâng cấp Open WebUI an toàn (Zero Data Loss & Auto-Rollback)"
    risk_tier: "MUTATING_OPS"
    service_lock: "open-webui"
    is_heavy_op: true
    timeout_seconds: 300
    runner: "host_script"
    target: "bash scripts/update-openwebui.sh {target_version}"
    param_rules:
      target_version: "^v[0-9]+\\.[0-9]+(\\.[0-9]+)?$"

  - id: "system.container.restart"
    slash: "/restart"
    description: "Khởi động lại một container bị treo"
    risk_tier: "SAFE_OPS"
    service_lock: "{service}"
    timeout_seconds: 60
    runner: "docker_cli"
    target: "docker restart {service}"
    param_rules:
      service: "^(open-webui|qwen36b|ai-gateway|smart-watchdog|cloudflared-tunnel|rag-service|milvus-standalone|neo4j-graph)$"

  - id: "rag.ingestion.state"
    slash: "/rag_state"
    description: "Kiểm tra tiến độ hàng đợi RAG Ingestion"
    risk_tier: "READ_ONLY"
    service_lock: null
    runner: "internal"

  - id: "ccba.skill.boost"
    slash: "/boost"
    description: "Tăng cường suy luận sâu cho kỹ năng bị kẹt (ADR-0052)"
    risk_tier: "MUTATING_OPS"
    service_lock: "ccba-tuner"
    is_heavy_op: true
    timeout_seconds: 600
    runner: "host_script"
    target: "bash /home/vvc/ccba/ccba-agent-platform/scripts/eval/run_boost_worktree.sh {skill}"
    param_rules:
      skill: "^[a-zA-Z0-9_-]+$"
