name: Dependency Radar & Scheduled Security Audit

on:
  schedule:
    - cron: '0 2 * * 1' # 02:00 UTC Monday weekly (09:00 AM VN)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  radar-scan:
    name: Radar Scan & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend Security Audit
        id: backend-audit
        run: |
          echo "### 🐍 Backend Audit Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          uvx pip-audit -r services/rag-service/requirements-ci.txt >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          uvx pip-audit -r services/rag-service/requirements-app.lock >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Frontend Security Audit
        id: frontend-audit
        working-directory: services/frontend
        run: |
          echo "### 📦 Frontend Audit Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check Outdated Versions
        id: check-outdated
        run: |
          echo "### 🔭 Dependency Outdated Radar" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          bash scripts/check_dependency_updates.sh --outdated >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
