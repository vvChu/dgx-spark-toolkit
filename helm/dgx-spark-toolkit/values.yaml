# Default values for dgx-spark-toolkit.

replicaCount: 1

image:
  repository: dgx-spark-toolkit-rag-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: rag.dgxspark.local
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: "4"
    memory: "16Gi"
    nvidia.com/gpu: 1
  requests:
    cpu: "2"
    memory: "8Gi"
    nvidia.com/gpu: 1

# Ingestion Worker Settings
ragWatcher:
  enabled: true
  replicaCount: 2
  resources:
    limits:
      cpu: "2"
      memory: "8Gi"
    requests:
      cpu: "1"
      memory: "4Gi"

# Milvus Settings
milvus:
  host: milvus-standalone
  port: 19530

# Neo4j Settings
neo4j:
  uri: bolt://neo4j-graph:7687
  user: neo4j
  password: bim_secure_pass_2026

# LiteLLM Gateway
aiGateway:
  image: ghcr.io/berriai/litellm:main-latest
  replicaCount: 1
  externalUrl: "http://ai-gateway:4000/v1"

# Database URLs
database:
  postgresUrl: "postgresql://litellm:litellm_pwd@litellm-db:5432/litellm"
  redisUrl: "redis://litellm-redis:6379/0"

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
