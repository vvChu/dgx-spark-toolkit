apiVersion: v1
kind: Service
metadata:
  name: {{ include "dgx-spark-toolkit.fullname" . }}-rag-service
  labels:
    {{- include "dgx-spark-toolkit.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dgx-spark-toolkit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rag-service
