apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dgx-spark-toolkit.fullname" . }}-secrets
  labels:
    {{- include "dgx-spark-toolkit.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded values (placeholders)
  neo4j-password: {{ .Values.neo4j.password | b64enc | quote }}
  litellm-key: {{ .Values.aiGateway.key | default "placeholder_key" | b64enc | quote }}
