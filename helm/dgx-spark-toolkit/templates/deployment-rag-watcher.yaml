apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dgx-spark-toolkit.fullname" . }}-rag-watcher
  labels:
    {{- include "dgx-spark-toolkit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ragWatcher.replicaCount }}
  selector:
    matchLabels:
      {{- include "dgx-spark-toolkit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rag-watcher
  template:
    metadata:
      labels:
        {{- include "dgx-spark-toolkit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rag-watcher
    spec:
      containers:
        - name: rag-watcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-m", "ingestion.pipeline"]
          env:
            - name: MILVUS_HOST
              value: {{ .Values.milvus.host | quote }}
            - name: MILVUS_PORT
              value: {{ .Values.milvus.port | quote }}
            - name: NEO4J_URI
              value: {{ .Values.neo4j.uri | quote }}
            - name: NEO4J_USER
              value: {{ .Values.neo4j.user | quote }}
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dgx-spark-toolkit.fullname" . }}-secrets
                  key: neo4j-password
            - name: VLLM_API_BASE
              value: {{ .Values.aiGateway.externalUrl | quote }}
          resources:
            {{- toYaml .Values.ragWatcher.resources | nindent 12 }}
